<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelecho</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            background-color: #ffffff;
            margin-top: 100px;
        }
        .login-card h2 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            text-align: center;
        }
        .login-card p.subtitle {
            text-align: center;
            margin-bottom: 2rem;
            color: #666;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            background-color: #0066cc;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0052a3;
        }
        .alert-msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            font-size: 0.9rem;
            text-align: center;
        }
        .alert-msg.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-msg.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <nav class="nav" id="navbar">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">
        <div class="nav__logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        intel<span class="accent">Echo</span>
      </a>

      <ul class="nav__links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="pricing.html">Pricing</a></li>
      </ul>

      <!-- <div class="nav__cta">
        <a href="./login.html" target="_blank" rel="noopener" class="btn btn-primary">Get Started</a>
      </div> -->
      


      <div class="nav__hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>


    <main class="login-wrapper">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to your Intelecho account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Emial">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div id="alertMsg" class="alert-msg"></div>
        </div>
    </main>

    <script>
        // Frontend-only authentication logic
        const VALID_EMAIL = "youmart50@gmail.com";
        const VALID_PASSWORD = "youmart@2025";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;
            const alertMsg = document.getElementById('alertMsg');

            alertMsg.style.display = 'block';

            if (emailInput === VALID_EMAIL && passwordInput === VALID_PASSWORD) {
                alertMsg.className = 'alert-msg success';
                alertMsg.textContent = 'Login successful! Redirecting...';
                
                // Store simulated session in browser storage
                localStorage.setItem('intelecho_logged_in', 'true');
                localStorage.setItem('intelecho_user', emailInput);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
            } else {
                alertMsg.className = 'alert-msg error';
                alertMsg.textContent = 'Invalid email or password.';
            }
        });
    </script>
</body>
</html>
